name: Deploy to WWW server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Inject latest update timestamp
        run: |
          LAST_UPDATE="$(git log -1 --format=%cd --date=format:'%-d.%-m.%Y %H:%M' "$GITHUB_SHA")"
          grep -q "__LAST_UPDATE__" index.html
          sed -i "s|__LAST_UPDATE__|$LAST_UPDATE|g" index.html

      - name: Deploy files with rsync
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
